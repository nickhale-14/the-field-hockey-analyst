<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Field Hockey Analyst</title>
<meta name="description" content="Independent stats on England Hockey's national leagues, and the FHA Weekly Predictor, coming soon.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Big+Shoulders+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1C2B3B; --sage:#6FA05E; --paper:#F6F5F0; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--navy); color:var(--paper);
         font-family:Arimo, system-ui, sans-serif; text-align:center; padding:24px 16px; }
  img { width:140px; height:140px; }
  h1 { font-family:"Big Shoulders Display", Impact, sans-serif; font-size:clamp(40px,9vw,72px);
       text-transform:uppercase; letter-spacing:.02em; line-height:.95; margin:28px 0 16px; }
  p { font-size:18px; opacity:.85; }
  .chip { display:inline-block; margin-top:28px; padding:6px 14px; border:1px solid var(--sage);
          color:var(--sage); border-radius:999px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
  <main>
    <img src="logo.png" alt="FHA logo">
    <h1>The Field Hockey<br>Analyst</h1>
    <p>The FHA Weekly Predictor is on its way.</p>
    <span class="chip">Coming soon</span>
  </main>
</body>
</html>
